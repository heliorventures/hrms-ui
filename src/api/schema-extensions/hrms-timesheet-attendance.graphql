# Merged for graphql-codegen until the stitched gateway introspection includes kabipay-attendance HRMS updates.

scalar NaiveDate
scalar DateTime

extend type TimesheetEntry {
  batchId: ID
}

type TimesheetWeekBatch {
  id: ID!
  tenantId: ID!
  employeeId: ID!
  employeeCode: String
  employeeName: String
  weekStartDate: NaiveDate!
  status: String!
  workflowInstanceId: ID
  submittedAt: DateTime
  rejectionReason: String
  """Configured workflow step title when status is PENDING and a workflow is in progress."""
  pendingApprovalStage: String
  """True when this user may approve/reject now (parity with expense/travel inbox fields)."""
  viewerMayApprove: Boolean!
}

type AttendanceAdjustmentPolicy {
  maxSelfAdjustDays: Int!
}

type TimesheetLockPolicy {
  editableWeekSpan: Int!
  lockApprovedEntries: Boolean!
}

type TimesheetProjectOption {
  code: String!
  name: String!
}

type AttendanceDailyReportRow {
  employeeId: ID!
  employeeName: String!
  employeeCode: String!
  workDate: NaiveDate!
  timezone: String!
  firstCheckInAt: DateTime
  lastCheckOutAt: DateTime
  loggedMinutes: Int!
  expectedMinutes: Int
  status: String!
  segmentCount: Int!
}

type AttendanceDailyReportEdge {
  cursor: String!
  node: AttendanceDailyReportRow!
}

type AttendanceDailyReportConnection {
  edges: [AttendanceDailyReportEdge!]!
  pageInfo: AttendancePageInfo!
}

type AttendanceReportSummary {
  totalDays: Int!
  presentDays: Int!
  halfDays: Int!
  absentDays: Int!
  onLeaveDays: Int!
  holidayDays: Int!
  weeklyOffDays: Int!
  incompleteDays: Int!
  unscheduledDays: Int!
  totalLoggedMinutes: Int!
}

input UpdateTimesheetEntryInput {
  id: ID!
  workDate: NaiveDate!
  hoursWorked: String!
  projectCode: String
  description: String
}

input UpsertAttendanceAdjustmentPolicyInput {
  maxSelfAdjustDays: Int!
}

input UpsertTimesheetLockPolicyInput {
  editableWeekSpan: Int!
  lockApprovedEntries: Boolean!
}

extend type Query {
  timesheetProjects(limit: Int): [TimesheetProjectOption!]!
  """Projects the employee may log against (JWT employee when employeeId omitted)."""
  timesheetProjectsForEmployee(employeeId: ID, limit: Int): [TimesheetProjectOption!]!
  """Whitelist only; empty means full catalog is allowed for that employee."""
  employeeTimesheetProjectCodes(employeeId: ID!): [String!]!
  timesheetTaskTypes(projectCode: String!): [String!]!
  attendanceAdjustmentPolicy: AttendanceAdjustmentPolicy!
  timesheetLockPolicy: TimesheetLockPolicy!
  timesheetWeekBatches(status: String, limit: Int): [TimesheetWeekBatch!]!
  attendanceDailyReport(
    fromDate: NaiveDate!
    toDate: NaiveDate!
    employeeId: ID
    employeeSearch: String
    first: Int
    after: String
  ): AttendanceDailyReportConnection!
  attendanceReportSummary(
    fromDate: NaiveDate!
    toDate: NaiveDate!
    employeeId: ID
    employeeSearch: String
  ): AttendanceReportSummary!
}

extend type Mutation {
  submitTimesheetWeek(weekStartDate: NaiveDate!): TimesheetWeekBatch!
  updateTimesheetEntry(input: UpdateTimesheetEntryInput!): TimesheetEntry!
  approveTimesheetWeekBatch(id: ID!): TimesheetWeekBatch!
  rejectTimesheetWeekBatch(id: ID!, rejectionReason: String): Boolean!
  upsertAttendanceAdjustmentPolicy(input: UpsertAttendanceAdjustmentPolicyInput!): AttendanceAdjustmentPolicy!
  upsertTimesheetLockPolicy(input: UpsertTimesheetLockPolicyInput!): TimesheetLockPolicy!
  upsertTimesheetProject(code: String!, name: String!, displayOrder: Int): Boolean!
  upsertTimesheetTaskTypes(projectCode: String!, taskCodes: [String!]!): Boolean!
  setEmployeeTimesheetProjects(employeeId: ID!, projectCodes: [String!]!): Boolean!
}
