# RBAC admin + HR shell (employee subgraph). Merge until gateway introspection includes these fields.

extend type Query {
  expenseAssignableRoles(limit: Int = 100): [TenantDirectoryRole!]!
  tenantDirectoryUsers(limit: Int = 100): [TenantDirectoryUser!]!
  tenantDirectoryRoles(limit: Int = 100): [TenantDirectoryRole!]!
  tenantCatalogPermissions(limit: Int = 300): [TenantCatalogPermission!]!
  permissionIdsForRole(roleId: ID!): [ID!]!
  roleIdsForUser(userId: ID!): [ID!]!
  permissionScopesForRole(roleId: ID!): [TenantPermissionScopeAssignment!]!
}

extend type Mutation {
  provisionEmployeeLogin(input: ProvisionEmployeeLoginInput!): Employee!
  resetEmployeePassword(input: ResetEmployeePasswordInput!): Boolean!
  setRolePermissions(roleId: ID!, permissionIds: [ID!]!): Boolean!
  setUserRoles(userId: ID!, roleIds: [ID!]!): Boolean!
  setRolePermissionScopes(roleId: ID!, scopes: [PermissionScopeAssignmentInput!]!): Boolean!
}

extend input CreateEmployeeInput {
  loginAccount: EmployeeLoginAccountInput
}

type TenantDirectoryUser {
  id: ID!
  username: String!
  email: String
  isActive: Boolean!
}

type TenantDirectoryRole {
  id: ID!
  name: String!
  description: String
  isSystemRole: Boolean!
}

type TenantCatalogPermission {
  id: ID!
  resource: String!
  action: String!
  description: String
}

type TenantPermissionScopeAssignment {
  id: ID!
  resource: String!
  action: String!
  scopeType: String!
}

input PermissionScopeAssignmentInput {
  resource: String!
  action: String!
  scopeType: String!
}

input EmployeeLoginAccountInput {
  username: String!
  email: String
  initialPassword: String!
  roleIds: [ID!]
}

input ProvisionEmployeeLoginInput {
  employeeId: ID!
  username: String!
  email: String
  initialPassword: String!
  roleIds: [ID!]
}

input ResetEmployeePasswordInput {
  employeeId: ID!
  newPassword: String!
}
