# Employee profile + HR document workflow (kabipay-employee). Merged for codegen when gateway is behind.

scalar JSON

extend type Employee {
  linkedUserUsername: String
  dateOfBirth: NaiveDate
  gender: String
  nationality: String
  bloodGroup: String
  emergencyContactName: String
  emergencyContactPhone: String
  emergencyContactRelation: String
  personalPhone: String
  currentAddress: String
  permanentAddress: String
}

extend type DocumentType {
  systemKey: String
}

extend type EmployeeDocument {
  originalFileName: String
  mimeType: String
  uploadedByUserId: ID
  documentTypeName: String
  documentTypeCategory: String
}

extend type Query {
  employeePrimaryBank(employeeId: ID!): EmployeeBankAccount
  employeeIdentityProfile(employeeId: ID!): EmployeeIdentityProfile!
  employeeDirectoryPage(limit: Int! = 100, after: String): EmployeeDirectoryPage!
  organizationDirectoryChart: [EmployeeDirectoryEntry!]!
  employeeProfileAccess(employeeId: ID!): EmployeeProfileAccess
  employeeProfileChangeRequests(employeeId: ID!, status: String): [EmployeeProfileChangeRequest!]!
  employeeProfileReviewQueue(status: String, limit: Int! = 50): [EmployeeProfileReviewQueueItem!]!
  employeeProfileChangeReviewDetail(requestId: ID!): EmployeeProfileChangeReviewDetail!
  employeeEvidenceReviewQueue(limit: Int! = 100): [EmployeeEvidenceReviewQueueItem!]!
  employeeDocumentAttachment(employeeDocumentId: ID!): EmployeeDocumentAttachment!
  tenantFileAttachment(fileStorageId: ID!): TenantFileAttachment!
  employeeEducationRecords(employeeId: ID!): [EmployeeEducation!]!
  employeeWorkExperienceRecords(employeeId: ID!): [EmployeeWorkExperience!]!
}

type EmployeeDirectoryEntry {
  employeeId: ID!
  employeeCode: String!
  fullName: String!
  departmentName: String
  designationTitle: String
  reportingManagerId: ID
  reportingManagerName: String
  employmentType: String
  dateOfJoining: NaiveDate!
  status: String!
}

type EmployeeDirectoryPage {
  rows: [EmployeeDirectoryEntry!]!
  nextCursor: String
  hasMore: Boolean!
}

type EmployeeProfileAccess {
  directoryEntry: EmployeeDirectoryEntry!
  isSelf: Boolean!
  canViewPrivateProfile: Boolean!
  canEditPersonalProfile: Boolean!
  canManageOrganizationFields: Boolean!
  canReviewProfileChanges: Boolean!
}

type EmployeeProfileChangeRequest {
  id: ID!
  employeeId: ID!
  requestType: String!
  status: String!
  requestedSummary: String!
  supportingDocumentId: ID
  reviewedBy: ID
  reviewedAt: DateTime
  rejectionReason: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeProfileReviewQueueItem {
  request: EmployeeProfileChangeRequest!
  employeeCode: String!
  employeeName: String!
  hasSupportingDocument: Boolean!
}

type EmployeeProfileChangeReviewDetail {
  request: EmployeeProfileChangeRequest!
  employeeCode: String!
  employeeName: String!
  currentValues: JSON!
  requestedValues: JSON!
}

type EmployeeDocumentAttachment {
  fileName: String!
  mimeType: String!
  fileSizeBytes: Int
  contentBase64: String!
}

type TenantFileAttachment {
  fileName: String!
  mimeType: String!
  fileSizeBytes: Int
  contentBase64: String!
}

type EmployeeEvidenceReviewQueueItem {
  recordId: ID!
  employeeId: ID!
  employeeCode: String!
  employeeName: String!
  evidenceType: String!
  summary: String!
  evidenceDocumentIds: [ID!]!
  createdAt: DateTime!
}

type EmployeeEducation {
  id: ID!
  employeeId: ID!
  educationLevel: String!
  qualification: String!
  fieldOfStudy: String
  institution: String!
  boardUniversity: String
  startDate: NaiveDate
  completionYear: Int!
  gradeScore: String
  description: String
  verificationStatus: String!
  evidenceDocumentIds: [ID!]!
  reviewedBy: ID
  reviewedAt: DateTime
  rejectionReason: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeWorkExperience {
  id: ID!
  employeeId: ID!
  company: String!
  roleTitle: String!
  employmentType: String
  location: String
  startDate: NaiveDate!
  endDate: NaiveDate
  isCurrent: Boolean!
  description: String
  verificationStatus: String!
  evidenceDocumentIds: [ID!]!
  reviewedBy: ID
  reviewedAt: DateTime
  rejectionReason: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeBankAccount {
  id: ID!
  bankName: String!
  accountNumberMasked: String!
  ifscCode: String!
  accountType: String
  isVerified: Boolean!
}

type EmployeePanRecord {
  id: ID!
  maskedPan: String!
  isVerified: Boolean!
}

type EmployeeAadhaarRecord {
  id: ID!
  maskedAadhaar: String!
  isVerified: Boolean!
}

type EmployeeIdentityProfile {
  pan: EmployeePanRecord
  aadhaar: EmployeeAadhaarRecord
}

input UpdateEmployeePersonalProfileInput {
  employeeId: ID!
  firstName: String
  lastName: String
  dateOfBirth: NaiveDate
  gender: String
  nationality: String
  bloodGroup: String
  emergencyContactName: String
  emergencyContactPhone: String
  emergencyContactRelation: String
}

input UpsertEmployeePrimaryBankInput {
  employeeId: ID!
  bankName: String!
  accountNumber: String!
  ifscCode: String!
  accountType: String
}

input UpsertEmployeePrimaryPanInput {
  employeeId: ID!
  panNumber: String!
}

input UpsertEmployeePrimaryAadhaarInput {
  employeeId: ID!
  aadhaarNumber: String!
}

input UploadEmployeeDocumentInput {
  employeeId: ID!
  documentTypeId: ID!
  fileName: String!
  mimeType: String
  contentBase64: String!
}

input UpdateEmployeeSelfServiceProfileInput {
  employeeId: ID!
  personalPhone: String
  currentAddress: String
  permanentAddress: String
  gender: String
  nationality: String
  bloodGroup: String
  emergencyContactName: String
  emergencyContactPhone: String
  emergencyContactRelation: String
}

input SubmitEmployeeProfileChangeInput {
  employeeId: ID!
  requestType: String!
  firstName: String
  lastName: String
  dateOfBirth: NaiveDate
  panNumber: String
  aadhaarNumber: String
  bankName: String
  accountNumber: String
  ifscCode: String
  accountType: String
  supportingDocumentId: ID
}

input UpsertEmployeeEducationInput {
  id: ID
  employeeId: ID!
  educationLevel: String!
  qualification: String!
  fieldOfStudy: String
  institution: String!
  boardUniversity: String
  startDate: NaiveDate
  completionYear: Int!
  gradeScore: String
  description: String
}

input UpsertEmployeeWorkExperienceInput {
  id: ID
  employeeId: ID!
  company: String!
  roleTitle: String!
  employmentType: String
  location: String
  startDate: NaiveDate!
  endDate: NaiveDate
  isCurrent: Boolean!
  description: String
}

input UploadTenantFileInput {
  fileName: String!
  mimeType: String
  contentBase64: String!
}

type UploadedTenantFile {
  id: ID!
  tenantId: ID!
  originalFileName: String
  mimeType: String
  fileSizeBytes: Int
  createdAt: DateTime!
}

extend type Mutation {
  updateEmployeePersonalProfile(input: UpdateEmployeePersonalProfileInput!): Employee!
  updateEmployeeSelfServiceProfile(input: UpdateEmployeeSelfServiceProfileInput!): Employee!
  submitEmployeeProfileChange(
    input: SubmitEmployeeProfileChangeInput!
  ): EmployeeProfileChangeRequest!
  cancelEmployeeProfileChange(requestId: ID!): EmployeeProfileChangeRequest!
  resolveEmployeeProfileChange(
    requestId: ID!
    approved: Boolean!
    rejectionReason: String
  ): EmployeeProfileChangeRequest!
  upsertEmployeeEducation(input: UpsertEmployeeEducationInput!): EmployeeEducation!
  deleteEmployeeEducation(employeeId: ID!, educationId: ID!): Boolean!
  linkEmployeeEducationEvidence(
    employeeId: ID!
    educationId: ID!
    employeeDocumentId: ID!
  ): EmployeeEducation!
  uploadEmployeeEducationEvidence(
    educationId: ID!
    input: UploadEmployeeDocumentInput!
  ): EmployeeEducation!
  resolveEmployeeEducation(
    educationId: ID!
    approved: Boolean!
    rejectionReason: String
  ): EmployeeEducation!
  upsertEmployeeWorkExperience(input: UpsertEmployeeWorkExperienceInput!): EmployeeWorkExperience!
  deleteEmployeeWorkExperience(employeeId: ID!, workExperienceId: ID!): Boolean!
  linkEmployeeWorkExperienceEvidence(
    employeeId: ID!
    workExperienceId: ID!
    employeeDocumentId: ID!
  ): EmployeeWorkExperience!
  uploadEmployeeWorkExperienceEvidence(
    workExperienceId: ID!
    input: UploadEmployeeDocumentInput!
  ): EmployeeWorkExperience!
  resolveEmployeeWorkExperience(
    workExperienceId: ID!
    approved: Boolean!
    rejectionReason: String
  ): EmployeeWorkExperience!
  upsertEmployeePrimaryBank(input: UpsertEmployeePrimaryBankInput!): EmployeeBankAccount!
  upsertEmployeePrimaryPan(input: UpsertEmployeePrimaryPanInput!): EmployeePanRecord!
  upsertEmployeePrimaryAadhaar(input: UpsertEmployeePrimaryAadhaarInput!): EmployeeAadhaarRecord!
  uploadEmployeeDocument(input: UploadEmployeeDocumentInput!): EmployeeDocument!
  uploadTenantFile(input: UploadTenantFileInput!): UploadedTenantFile!
  resolveEmployeeDocument(employeeDocumentId: ID!, approved: Boolean!): EmployeeDocument!
}
