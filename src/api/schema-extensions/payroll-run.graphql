# Merged for graphql-codegen when the supergraph lags. Do not re-declare
# `CreatePayrollCycleInput` or `createPayrollCycle` — the gateway (kabipay-payroll)
# owns those; re-defining `paymentDate` with a different scalar breaks schema merge
# (e.g. `Date` vs `NaiveDate`).

type PayrollComplianceSetting {
  employerTan: String
  employerLegalName: String
  baseSalaryComponentCode: String!
  arrearSalaryComponentCode: String!
  payslipHeaderTitle: String
  payslipLogoFileStorageId: ID
}

input UpsertPayrollComplianceSettingInput {
  employerTan: String
  employerLegalName: String
  baseSalaryComponentCode: String
  arrearSalaryComponentCode: String
  payslipHeaderTitle: String
  payslipLogoFileStorageId: ID
}

extend type Query {
  payrollComplianceSetting: PayrollComplianceSetting
  payslipLogoSignedReadUrl(fileStorageId: ID!, ttlSeconds: Int = 600): String!
  payrollBankTransferCsv(month: Int!, year: Int!): String!
  payrollIndiaBulkNeftCreditCsv(month: Int!, year: Int!): String!
  indiaFyPayrollEmployeeTotalsCsv(fyStartYear: Int!): String!
  indiaFyQuarterPayrollEmployeeTotalsCsv(fyStartYear: Int!, quarter: Int!): String!
  indiaForm16PartBFyPrepStubCsv(fyStartYear: Int!): String!
  indiaForm24qSalaryPaymentMonthlyStubCsv(month: Int!, year: Int!): String!
  indiaEpfMonthlyEcrPrepStubCsv(month: Int!, year: Int!): String!
}

extend type Mutation {
  upsertPayrollComplianceSetting(
    input: UpsertPayrollComplianceSettingInput!
  ): PayrollComplianceSetting!
}
