extend type Query {
  loanPolicy(id: String!): LoanPolicy!
  previewLoanApproval(requestId: String!, terms: JSON!, effectiveFrom: NaiveDate!, firstDueDate: NaiveDate!): JSON!
  loanSchedulePreview(loanId: String!, firstDueDate: NaiveDate!): JSON!
  loanStatement(loanId: String!, expectedVersion: Int!, after: String, first: Int! = 100): LoanPostingConnection!
  loanApprovalWorkflows(after: String, first: Int! = 25): LoanApprovalWorkflowConnection!
  loanPolicyVersions(after: String, first: Int! = 25): LoanPolicyConnection!
  previewLoanReversal(loanId: String!, postingId: String!): LoanCorrectionPreview!
  loanPayments(loanId: String!, after: String, first: Int! = 25): LoanPaymentConnection!
  loanSchedules(loanId: String!, after: String, first: Int! = 25): LoanScheduleConnection!
  myLoans(after: String, first: Int! = 25): LoanAccountConnection!
  loanAccounts(employeeId: String, search: String, state: String, after: String, first: Int! = 25): LoanAccountConnection!
  myLoanRequests(after: String, first: Int! = 25): LoanRequestConnection!
  loanRequestQueue(employeeId: String, search: String, state: String, after: String, first: Int! = 25): LoanRequestConnection!
  loanAccount(id: String!): LoanAccount!
  loanPolicies(after: String, first: Int! = 25): LoanPolicyConnection!
  loanLedger(loanId: String!, after: String, first: Int! = 25): LoanPostingConnection!
  previewLoanExitReview(separationId: UUID!, settlementDate: NaiveDate!): LoanExitReviewPreview!
  previewFnfLoanExposure(separationId: UUID!, settlementDate: NaiveDate!): JSON!
  financeFollowUpOwners(after: UUID, first: Int! = 25): FinanceOwnerConnection!
  fnfSettlement(separationId: ID!): FnfSettlement
  fnfFinancialReview(separationId: UUID!): FnfFinancialPreparation!
  """
  Recover an uncertain approval without creating a second financial decision.
  """
  exitApprovalOperation(separationId: ID!): ExitApprovalOperation
}

extend type Mutation {
  recordHistoricalLoanPayment(input: RecordHistoricalLoanPaymentInput!): LoanCommandResult!
  cancelLoanFunding(input: CancelLoanFundingInput!): LoanCommandResult!
  retireLoanPolicy(input: RetireLoanPolicyInput!): LoanCommandResult!
  saveLoanRequest(input: SubmitLoanRequestInput!): LoanCommandResult!
  publishLoanPolicy(input: PublishLoanPolicyInput!): LoanCommandResult!
  submitLoanRequest(input: SubmitLoanRequestInput!): LoanCommandResult!
  decideLoanRequest(input: DecideLoanRequestInput!): LoanCommandResult!
  withdrawLoanRequest(input: WithdrawLoanRequestInput!): LoanCommandResult!
  recordLoanDisbursement(input: RecordLoanPaymentInput!): LoanCommandResult!
  recordLoanReceipt(input: RecordLoanPaymentInput!): LoanCommandResult!
  setLoanDeduction(input: SetLoanDeductionInput!): LoanCommandResult!
  setLoanPeriodOverride(input: SetLoanPeriodOverrideInput!): LoanCommandResult!
  reverseLoanPosting(input: ReverseLoanPostingInput!): LoanCommandResult!
  saveLoanExitReview(input: LoanExitReviewInput!): LoanExitReviewResult!
  upsertFnfSettlement(input: UpsertFnfSettlementInput!): FnfSettlement!
  saveFnfFinancialReview(input: SaveFnfFinancialReviewInput!): FnfFinancialPreparation!
  finalizeFnfSettlement(separationId: ID!, expectedRevision: Int, expectedFingerprint: String): FnfSettlement!
  """
  Approve a pending separation (HR / directory roles — same gate as `createEmployee`).
  """
  approveSeparation(separationId: ID!, financeReviewId: ID): Separation!
  """Reject a pending separation (HR / directory roles)."""
  cancelExitApproval(operationId: ID!): Boolean!
}
