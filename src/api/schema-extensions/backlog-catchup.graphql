# Merged for graphql-codegen; trim when the federated supergraph already exposes these.
scalar DateTime

type PayrollArrear {
  id: ID!
  tenantId: ID!
  employeeId: ID!
  amount: String!
  reason: String
  status: String!
  appliedPayrollCycleId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreatePayrollArrearInput {
  employeeId: ID!
  amount: String!
  reason: String
}

extend type Query {
  payrollArrears(limit: Int! = 100): [PayrollArrear!]!
}

extend type Mutation {
  createPayrollArrear(input: CreatePayrollArrearInput!): PayrollArrear!
}

type WorkflowStep {
  id: ID!
  tenantId: ID!
  workflowId: ID!
  sequenceOrder: Int!
  stepName: String!
  approverType: String
  approverRoleId: ID
  approverPermission: String
  canSkip: Boolean!
  slaHours: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

extend input CreateWorkflowStepInput {
  approverPermission: String
}

type WorkflowWithSteps {
  workflow: Workflow!
  steps: [WorkflowStep!]!
}

extend type Query {
  workflowsWithSteps(limit: Int! = 50): [WorkflowWithSteps!]!
  workflowSteps(workflowId: ID!): [WorkflowStep!]!
}

# kabipay-analytics — merged for codegen until gateway includes federation update
type WebhookDeliveryLogRow {
  id: ID!
  webhookSubscriptionId: ID!
  eventName: String
  payloadJson: String
  httpStatus: Int
  responseBody: String
  isSuccess: Boolean!
  attemptNumber: Int!
  deliveredAt: DateTime!
  createdAt: DateTime!
}

extend type Query {
  webhookDeliveryLogs(limit: Int! = 100): [WebhookDeliveryLogRow!]!
}

extend type Mutation {
  deleteWorkflowStep(stepId: ID!): Boolean!
  reorderWorkflowSteps(workflowId: ID!, stepIdsOrdered: [ID!]!): [WorkflowStep!]!
}

# Leave approval inbox state, merged locally until the federated gateway is restarted.
extend type LeaveRequest {
  pendingApprovalStage: String
  pendingApprovalStepId: ID
  viewerMayApprove: Boolean!
}

extend type Expense {
  pendingApprovalStepId: ID
}

extend type TravelRequest {
  pendingApprovalStepId: ID
}
