extend type SalaryComponent { showOnPayslip: Boolean! }
extend type SalaryBreakupPreview { financials: JSON }
type PayslipDisplayLine { id: String!, code: String!, name: String!, componentType: String!, amount: String! }
type PayslipPresentation { lines: [PayslipDisplayLine!]!, statement: JSON }
extend type Query {
  employeeImportedProfile(employeeId: ID!): JSON!
  payslipPresentation(payslipId: ID!): PayslipPresentation
  payrollPeriodInput(employeeId: ID!, year: Int!, month: Int!): JSON
  payrollApprovedLwpReview(employeeId: ID!, year: Int!, month: Int!): JSON!
  leaveImportHistory(employeeId: ID, year: Int!): JSON
}
extend type Mutation {
  setSalaryComponentPayslipVisibility(componentId: ID!, visible: Boolean!): Boolean!
  savePayrollPeriodInput(employeeId: ID!, input: JSON!, expectedRevision: Int): JSON!
}
