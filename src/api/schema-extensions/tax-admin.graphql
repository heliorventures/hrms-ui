# Merged for graphql-codegen when kabipay-tax supergraph omits newer fields.

type TaxSectionDefinition {
  id: ID!
  tenantId: ID!
  sectionCode: String!
  sectionLabel: String!
  regimeScope: String
  countryCode: String!
  displayOrder: Int!
  isActive: Boolean!
  maxDeductionAmount: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

extend type Query {
  employeeTaxSettings(employeeId: ID): JSON!
  employeeTaxHistory(employeeId: ID, fiscalYear: Int!): JSON!
  employeeTaxDeclaration(employeeId: ID, fiscalYear: Int!): JSON
  employeeTaxProjection(employeeId: ID, fiscalYear: Int!, month: Int!): JSON!
  employeeTaxSubmissionContext(employeeId: ID, fiscalYear: Int!): JSON
  taxSectionDefinitions(activeOnly: Boolean = true, limit: Int = 100): [TaxSectionDefinition!]!
}

input UpsertTaxComputationInput {
  taxConfigVersionId: ID
  fiscalYear: Int!
  taxRegimeChosen: String
  grossIncome: String
  totalDeductions: String
  taxableIncome: String
  finalTax: String
  tdsPerMonth: String
}

input SubmitTaxProofLineInput {
  taxRegimeChosen: String
  taxConfigVersionId: ID
  fiscalYear: Int!
  sectionCode: String!
  declaredAmount: String!
  actualAmount: String!
  fileStorageId: ID!
}

input UpsertTaxSectionDefinitionInput {
  sectionCode: String!
  sectionLabel: String!
  regimeScope: String
  countryCode: String
  displayOrder: Int
  isActive: Boolean
  maxDeductionAmount: String
}

input UpsertTaxConfigurationVersionInput {
  id: ID
  fiscalYear: Int!
  regime: String
  countryCode: String!
  isActive: Boolean!
}

input UpsertTaxSlabInput {
  id: ID
  taxConfigVersionId: ID!
  incomeFrom: String!
  incomeTo: String
  taxRate: String
  surchargeRate: String
  cessRate: String
}

extend type Mutation {
  saveEmployeeTaxSettings(employeeId: ID!, input: JSON!, expectedRevision: Int): JSON!
  saveEmployeeTaxHistory(employeeId: ID!, input: JSON!, expectedRevision: Int): JSON!
  upsertTaxSectionDefinition(input: UpsertTaxSectionDefinitionInput!): TaxSectionDefinition!
  upsertTaxConfigurationVersion(
    input: UpsertTaxConfigurationVersionInput!
  ): TaxConfigurationVersion!
  upsertTaxSlab(input: UpsertTaxSlabInput!): TaxSlab!
}
