# kabipay-notification subgraph — merged for codegen when gateway introspection lags.

input CreateAnnouncementInput {
  title: String!
  body: String
  targetAudience: String
  targetDepartmentId: ID
  targetLocationId: ID
  targetRoleCode: String
  publishAt: DateTime
  expiresAt: DateTime
  employeePost: Boolean = true
  imageFileName: String
  imageMimeType: String
  imageContentBase64: String
  documentFileName: String
  documentMimeType: String
  documentContentBase64: String
  videoUploadStageId: UUID
  videoLink: String
}

input UpdateAnnouncementInput {
  id: ID!
  title: String
  body: String
  targetAudience: String
  targetDepartmentId: ID
  targetLocationId: ID
  clearTargetDepartment: Boolean = false
  clearTargetLocation: Boolean = false
  targetRoleCode: String
  clearRoleAudience: Boolean = false
  publishAt: DateTime
  expiresAt: DateTime
  clearPublishAt: Boolean = false
  clearExpiresAt: Boolean = false
  imageFileName: String
  imageMimeType: String
  imageContentBase64: String
  documentFileName: String
  documentMimeType: String
  documentContentBase64: String
  clearImage: Boolean = false
  clearDocument: Boolean = false
  videoUploadStageId: UUID
  videoLink: String
  removeVideo: Boolean = false
}

input CreateDirectNotificationsInput {
  userIds: [ID!]!
  kind: String
  title: String
  message: String
  actionUrl: String
}

input UpdateNotificationAdminInput {
  id: ID!
  kind: String
  title: String
  message: String
  actionUrl: String
}

type NotificationPreferences {
  inAppEnabled: Boolean!
  announcementsEnabled: Boolean!
  mutedTopics: [String!]!
}

input UpdateNotificationPreferencesInput {
  inAppEnabled: Boolean!
  announcementsEnabled: Boolean!
  mutedTopics: [String!]!
}

extend type Announcement {
  hasVideoAttachment: Boolean!
  videoLink: String
  postSource: String!
  targetDepartmentId: ID
  targetLocationId: ID
}

type NotificationAutomationSettings {
  birthdayEnabled: Boolean!
  workAnniversaryEnabled: Boolean!
  companySharingEnabled: Boolean!
  deliveryLocalTime: NaiveTime!
  birthdayTitleTemplate: String!
  birthdayMessageTemplate: String!
  anniversaryTitleTemplate: String!
  anniversaryMessageTemplate: String!
}

input SaveNotificationAutomationSettingsInput {
  birthdayEnabled: Boolean!
  workAnniversaryEnabled: Boolean!
  companySharingEnabled: Boolean!
  deliveryLocalTime: NaiveTime!
  birthdayTitleTemplate: String!
  birthdayMessageTemplate: String!
  anniversaryTitleTemplate: String!
  anniversaryMessageTemplate: String!
}

type CelebrationPreferences {
  shareBirthday: Boolean!
  shareWorkAnniversary: Boolean!
}

input UpdateCelebrationPreferencesInput {
  shareBirthday: Boolean!
  shareWorkAnniversary: Boolean!
}

extend type Query {
  announcementVideo(announcementId: UUID!): AnnouncementVideo!
  adminAnnouncements(limit: Int = 100): [Announcement!]!
  adminNotifications(limit: Int = 100): [Notification!]!
  unreadNotificationCount: Int!
  myNotificationPreferences: NotificationPreferences!
  notificationAutomationSettings: NotificationAutomationSettings!
  myCelebrationPreferences: CelebrationPreferences!
}

extend type Mutation {
  prepareAnnouncementVideoUpload(fileName: String!, mimeType: String!, fileSizeBytes: Int!): AnnouncementVideoUpload!
  createAnnouncement(input: CreateAnnouncementInput!): Announcement!
  updateAnnouncement(input: UpdateAnnouncementInput!): Announcement!
  deleteAnnouncement(id: ID!): Boolean!
  createDirectNotifications(input: CreateDirectNotificationsInput!): Int!
  updateNotificationAdmin(input: UpdateNotificationAdminInput!): Notification!
  deleteNotificationAdmin(id: ID!): Boolean!
  updateNotificationPreferences(input: UpdateNotificationPreferencesInput!): NotificationPreferences!
  saveNotificationAutomationSettings(input: SaveNotificationAutomationSettingsInput!): NotificationAutomationSettings!
  updateMyCelebrationPreferences(input: UpdateCelebrationPreferencesInput!): CelebrationPreferences!
}

type AnnouncementVideoUpload {
  stageId: UUID!
  uploadUrl: String!
  expiresAt: DateTime!
}

type AnnouncementVideo {
  playbackUrl: String!
  mimeType: String!
  fileName: String!
  expiresAt: DateTime!
}
