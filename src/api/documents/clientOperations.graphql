# India statutory stub: CSV from payslip rows for the payroll cycle (month + calendar year).
# Requires payroll:statutory_export or HR / tenant admin (see JWT RBAC).
query IndiaTdsMonthlySummaryCsv($month: Int!, $year: Int!) {
  indiaTdsMonthlySummaryCsv(month: $month, year: $year)
}

# India PF/ESI stub: payslip columns for the payroll cycle (month + calendar year). Same RBAC as TDS CSV.
query IndiaPfEsiMonthlySummaryCsv($month: Int!, $year: Int!) {
  indiaPfEsiMonthlySummaryCsv(month: $month, year: $year)
}

# Net pay + primary employee_bank per payslip in the selected cycle (month/year). HR / statutory_export.
query PayrollBankTransferCsv($month: Int!, $year: Int!) {
  payrollBankTransferCsv(month: $month, year: $year)
}

# India NEFT-style bulk credit prep (same cycle as month/year above). HR / statutory_export.
query PayrollIndiaBulkNeftCreditCsv($month: Int!, $year: Int!) {
  payrollIndiaBulkNeftCreditCsv(month: $month, year: $year)
}

# India FY employee totals from all payslips in that financial year (April–March). HR / statutory_export.
query IndiaFyPayrollEmployeeTotalsCsv($fyStartYear: Int!) {
  indiaFyPayrollEmployeeTotalsCsv(fyStartYear: $fyStartYear)
}

# Same measures as FY totals, scoped to FY quarter Q1 (Apr–Jun) … Q4 (Jan–Mar next year). HR / statutory_export.
query IndiaFyQuarterPayrollEmployeeTotalsCsv($fyStartYear: Int!, $quarter: Int!) {
  indiaFyQuarterPayrollEmployeeTotalsCsv(fyStartYear: $fyStartYear, quarter: $quarter)
}

# Form 16 Part B–oriented column names; placeholders for employer TAN/name — not a certificate PDF.
query IndiaForm16PartBFyPrepStubCsv($fyStartYear: Int!) {
  indiaForm16PartBFyPrepStubCsv(fyStartYear: $fyStartYear)
}

# Form 24Q salary payment month stub (not TRACES upload). Same month/year as TDS section.
query IndiaForm24qSalaryPaymentMonthlyStubCsv($month: Int!, $year: Int!) {
  indiaForm24qSalaryPaymentMonthlyStubCsv(month: $month, year: $year)
}

