# Single round-trip for `/admin/expense-categories` policy modal (notifications still use **`OrgDepartments`** only).
query ExpensePolicyDirectory($lim: Int! = 320) {
  departments(limit: $lim) {
    id
    name
    code
    parentDepartmentId
  }
  designations(limit: $lim) {
    id
    title
    departmentId
    level
  }
  expenseAssignableRoles(limit: $lim) {
    id
    name
    description
    isSystemRole
