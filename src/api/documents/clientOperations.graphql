# Onboarding — FNF + clearance (employee subgraph)
query ClientOpsFnfBySeparation($separationId: ID!) {
  fnfSettlement(separationId: $separationId) {
    id
    separationId
    leaveEncashment
    gratuityAmount
    bonusPayable
    recoveryAmount
    netPayable
    status
    processedAt
    createdAt
  }
}

query ClientOpsClearanceBySeparation($separationId: ID!) {
  clearanceChecklist(separationId: $separationId) {
    id
    separationId
    department
    taskName
    isCleared
    clearedAt
  }
}

mutation ClientOpsUpsertFnf($input: UpsertFnfSettlementInput!) {
  upsertFnfSettlement(input: $input) {
    id
    leaveEncashment
    gratuityAmount
    bonusPayable
    recoveryAmount
    netPayable
    status
  }
}

mutation ClientOpsFinalizeFnf($separationId: ID!) {
  finalizeFnfSettlement(separationId: $separationId) {
    id
    status
    netPayable
    processedAt
  }
}

mutation ClientOpsSetClearanceCleared($clearanceId: ID!, $isCleared: Boolean!) {
  setClearanceItemCleared(clearanceId: $clearanceId, isCleared: $isCleared) {
    id
    isCleared
    clearedAt
  }
}

mutation ClientOpsEnsureOffboarding($separationId: ID!) {
  ensureSeparationOffboardingArtifacts(separationId: $separationId)
}

query WorkplaceCompensationData(
  $blim: Int! = 100
  $clim: Int! = 20
  $dlim: Int! = 200
) {
  designations(limit: $dlim) {
    id
    title
  }
  salaryBands(limit: $blim) {
    id
    designationId
    grade
    minSalary
    midSalary
    maxSalary
    currency
    effectiveYear
  }
  compensationReviewCycles(limit: $clim) {
    id
    name
    year
    startDate
    endDate
    status
    budgetPercentage
  }
}
