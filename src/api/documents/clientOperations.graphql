}

# India statutory stub: CSV from payslip rows for the payroll cycle (month + calendar year).
# Requires payroll:statutory_export or HR / tenant admin (see JWT RBAC).
query IndiaTdsMonthlySummaryCsv($month: Int!, $year: Int!) {
  indiaTdsMonthlySummaryCsv(month: $month, year: $year)
}

# India PF/ESI stub: payslip columns for the payroll cycle (month + calendar year). Same RBAC as TDS CSV.
query IndiaPfEsiMonthlySummaryCsv($month: Int!, $year: Int!) {
  indiaPfEsiMonthlySummaryCsv(month: $month, year: $year)
}

# Net pay + primary employee_bank per payslip in the selected cycle (month/year). HR / statutory_export.
query PayrollBankTransferCsv($month: Int!, $year: Int!) {
  payrollBankTransferCsv(month: $month, year: $year)
}

# v1 pay run — HR / statutory_export; generates missing payslips from employment_history + BASIC line
mutation RunPayrollForCycle($payrollCycleId: ID!) {
  runPayrollForCycle(payrollCycleId: $payrollCycleId) {
    id
    status
    month
    year
    name
  }
}

# DRAFT cycle for a calendar month; rejected if a cycle for that month/year already exists.
mutation CreatePayrollCycle($input: CreatePayrollCycleInput!) {
  createPayrollCycle(input: $input) {
