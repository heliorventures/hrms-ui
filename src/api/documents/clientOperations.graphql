# Operations that need a client JWT (employee resolved from claims). Not for unauthenticated x-tenant-id-only probes.

query LeaveBalances($limit: Int! = 20, $year: Int) {
  leaveBalances(limit: $limit, year: $year) {
    id
    leaveTypeId
    year
    balanceDays
    entitledDays
    pendingDays
    usedDays
    carriedForwardDays
  }
}

query ClientOpsUpcomingHolidays($fromDate: NaiveDate, $limit: Int! = 15) {
  upcomingHolidays(fromDate: $fromDate, limit: $limit) {
    id
    holidayDate
    name
    calendarName
    holidayType
  }
}

query TimesheetRows($limit: Int! = 50) {
  timesheetEntries(limit: $limit) {
    id
    workDate
    hoursWorked
    projectCode
    description
    status
  }
}

query TaxComputationsList($limit: Int! = 10) {
  taxComputations(limit: $limit) {
    id
    fiscalYear
    taxConfigVersionId
    taxRegimeChosen
    grossIncome
    totalDeductions
    taxableIncome
    finalTax
    tdsPerMonth
    computedAt
  }
}

query TaxProofLines(
  $employeeId: ID
  $taxConfigVersionId: ID
  $fiscalYear: Int
) {
  taxProofLines(
    employeeId: $employeeId
    taxConfigVersionId: $taxConfigVersionId
    fiscalYear: $fiscalYear
  ) {
    id
    sectionCode
    declaredAmount
    actualAmount
    status
    fileStorageId
    rejectionReason
    fiscalYear
  }
}

query OrgDocumentsList($tlim: Int! = 50, $dlim: Int! = 50) {
  documentTypes(limit: $tlim) {
    id
    name
    category
    isRequired
  }
  employeeDocuments(limit: $dlim) {
    id
    documentTypeId
    status
    uploadedAt
    expiryDate
  }
}

query ClientOpsPayslipsList($limit: Int! = 10) {
  payslips(limit: $limit) {
    id
    netSalary
    grossSalary
    totalDeductions
    status
    generatedAt
    lines {
      id
      salaryComponentId
      amount
      componentType
    }
  }
}

# India statutory stub: CSV from payslip rows for the payroll cycle (month + calendar year).
# Requires payroll:statutory_export or HR / tenant admin (see JWT RBAC).
query IndiaTdsMonthlySummaryCsv($month: Int!, $year: Int!) {
  indiaTdsMonthlySummaryCsv(month: $month, year: $year)
}

mutation SubmitLeaveRequest($input: SubmitLeaveRequestInput!) {
  submitLeaveRequest(input: $input) {
    id
    status
    fromDate
    toDate
    daysRequested
    workflowInstanceId
  }
}

mutation ApproveLeaveRequest($leaveRequestId: ID!) {
  approveLeaveRequest(leaveRequestId: $leaveRequestId) {
    id
    status
    employeeId
    fromDate
    toDate
    daysRequested
    workflowInstanceId
  }
}

mutation RejectLeaveRequest($leaveRequestId: ID!, $reason: String) {
  rejectLeaveRequest(leaveRequestId: $leaveRequestId, reason: $reason) {
    id
    status
    reason
    workflowInstanceId
  }
}

mutation SubmitExpense($input: SubmitExpenseInput!) {
  submitExpense(input: $input) {
    id
    status
    amount
    title
  }
}

mutation ApproveExpense($expenseId: ID!) {
  approveExpense(expenseId: $expenseId) {
    id
    status
    amount
    title
  }
}

mutation RejectExpense($expenseId: ID!, $reason: String) {
  rejectExpense(expenseId: $expenseId, reason: $reason) {
    id
    status
    title
  }
}

mutation MarkNotificationRead($id: ID!) {
  markNotificationRead(id: $id) {
    id
    isRead
  }
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead
}

mutation PunchToday($input: PunchTodayInput) {
  punchToday(input: $input) {
    id
    workDate
    checkInTime
    checkOutTime
    checkInLat
    checkInLng
    checkOutLat
    checkOutLng
    source
    status
  }
}

mutation AddManualAttendanceSegment($input: AddManualAttendanceSegmentInput!) {
  addManualAttendanceSegment(input: $input) {
    id
    workDate
    checkInTime
    checkOutTime
    source
    status
  }
}

mutation CreateTimesheetEntry($input: CreateTimesheetEntryInput!) {
  createTimesheetEntry(input: $input) {
    id
    workDate
    hoursWorked
    projectCode
    status
  }
}

mutation DeleteTimesheetEntry($id: ID!) {
  deleteTimesheetEntry(id: $id)
}

mutation UpsertTaxComputation($input: UpsertTaxComputationInput!) {
  upsertTaxComputation(input: $input) {
    id
    fiscalYear
    taxRegimeChosen
  }
}

mutation SubmitTaxProofLine($input: SubmitTaxProofLineInput!) {
  submitTaxProofLine(input: $input) {
    id
    status
    sectionCode
    declaredAmount
    actualAmount
  }
}

mutation ApproveTaxProofLine($taxProofLineId: ID!) {
  approveTaxProofLine(taxProofLineId: $taxProofLineId) {
    id
    status
    sectionCode
  }
}

mutation RejectTaxProofLine($taxProofLineId: ID!, $reason: String) {
  rejectTaxProofLine(taxProofLineId: $taxProofLineId, reason: $reason) {
    id
    status
    sectionCode
  }
}

mutation CreateEmployee($input: CreateEmployeeInput!) {
  createEmployee(input: $input) {
    id
    employeeCode
    fullName
    status
    dateOfJoining
  }
}

mutation UpdateEmployee($input: UpdateEmployeeInput!) {
  updateEmployee(input: $input) {
    id
    employeeCode
    fullName
    status
    dateOfJoining
    departmentId
    designationId
    employmentType
  }
}

query OrgDepartments($limit: Int! = 100) {
  departments(limit: $limit) {
    id
    name
    code
    parentDepartmentId
  }
}

query OrgDesignations($limit: Int! = 100) {
  designations(limit: $limit) {
    id
    title
    departmentId
    level
    grade
  }
}
