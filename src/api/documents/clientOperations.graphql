# Workplace — talent & pay (read v1; kabipay-succession / kabipay-compensation subgraphs)
query WorkplaceSuccessionData($clim: Int! = 100, $plim: Int! = 50) {
  competencies(limit: $clim) {
    id
    name
    category
    description
  }
  talentPools(limit: $plim) {
    id
    name
    description
  }
}

# Insights (kabipay-analytics subgraph, port 4029)
query InsightsWorkforce($lim: Int! = 24) {
  workforceSnapshots(limit: $lim) {
    id
    snapshotDate
    totalHeadcount
    activeEmployees
    newJoiners
    separations
    openPositions
    averageTenureMonths
    attritionRate
  }
}

query InsightsReportsSchedules {
  reportDefinitions(limit: 50) {
    id
    name
    entityType
    chartType
    isPublic
  }
  reportSchedules(limit: 30) {
    id
    frequency
    isActive
    deliveryFormat
  }
}

query InsightsDashboards {
  dashboards(limit: 20) {
    id
    name
    description
    isDefault
  }
  dashboardWidgets(limit: 50) {
    id
    dashboardId
    title
    widgetType
  }
}

query InsightsOutbox($lim: Int! = 50) {
  outboxEvents(limit: $lim) {
    id
    eventType
    aggregateType
    status
    createdAt
    processedAt
    retryCount
    lastError
  }
}

# Analytics (kabipay-analytics) — requires gateway to include subgraph
mutation RequeueOutbox($id: ID!) {
  requeueOutboxEvent(id: $id) {
    id
    status
    lastError
  }
}

# Onboarding — employee subgraph
query OnboardingChecklist($limit: Int! = 100) {
  onboardingChecklist(limit: $limit) {
    id
    taskName
    taskCategory
    dueDate
    isCompleted
  }
}

mutation SetOnboardingChecklistItem($checklistItemId: ID!, $isCompleted: Boolean!) {
  setOnboardingChecklistItemCompleted(checklistItemId: $checklistItemId, isCompleted: $isCompleted) {
    id
    isCompleted
  }
}

# Admin — workflow subgraph
query AdminWorkflowsData($wl: Int! = 30, $il: Int! = 50) {
  workflows(limit: $wl) {
    id
    name
    entityType
    isActive
  }
  workflowInstances(limit: $il) {
    id
    status
    entityType
    entityId
  }
}

query ClientOpsSeparationsList($limit: Int! = 50) {
  separations(limit: $limit) {
    id
    separationType
    resignationDate
    lastWorkingDate
    reason
    status
    createdAt
  }
}

mutation ClientOpsSubmitSeparation($input: SubmitSeparationInput!) {
  submitSeparation(input: $input) {
    id
    status
    lastWorkingDate
  }
}

mutation ApproveSeparation($separationId: ID!) {
  approveSeparation(separationId: $separationId) {
    id
    status
  }
}

mutation RejectSeparation($separationId: ID!) {
  rejectSeparation(separationId: $separationId) {
