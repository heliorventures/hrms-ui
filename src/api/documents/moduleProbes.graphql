# One query per KabiPay subgraph, kept intentionally shallow so every
# module shows a "tick" in the connectivity dashboard and the engineering
# team has a canonical sample document to copy when wiring real screens.
#
# Field names here MUST match the Rust DTOs exposed by each subgraph in
# `kabipay-svc/crates/<svc>/src/resolvers/types.rs` — otherwise the
# gateway will reject the operation before it ever hits the subgraph.

query ModuleProbeLeaveBoard($limit: Int! = 20) {
  leaveTypes(limit: $limit) {
    id
    name
    code
    isPaid
  }
  leaveRequests(limit: $limit) {
    id
    employeeId
    status
    fromDate
    toDate
    daysRequested
  }
}

