fragment LoanAccountFields on LoanAccount {
  id employeeId employeeName employeeCode requestId loanNumber purpose approvedPrincipal currency minorUnits state fundingState version principal interest outstanding disbursed repaid unappliedCredit terms
}
fragment LoanRequestFields on LoanRequest {
  id employeeId employeeName employeeCode policyId preferences createdAt requestedAmount currency purpose employeeNotes state version workflowInstanceId currentStepId isFinalApprovalStep decisionReason
}
fragment LoanCommandFields on LoanCommandResult {
  recordId loanId employeeId version state postingIds unappliedCredit
}
query MyLoans($after: String, $first: Int!) {
  myLoans(after: $after, first: $first) { nodes { ...LoanAccountFields } pageInfo { endCursor hasNextPage } }
}
query LoanAccounts($employeeId: String, $after: String, $first: Int!, $search: String, $state: String) {
  loanAccounts(employeeId: $employeeId, after: $after, first: $first, search: $search, state: $state) { nodes { ...LoanAccountFields } pageInfo { endCursor hasNextPage } }
}
query MyLoanRequests($after: String, $first: Int!) {
  myLoanRequests(after: $after, first: $first) { nodes { ...LoanRequestFields } pageInfo { endCursor hasNextPage } }
}
query LoanRequestQueue($employeeId: String, $after: String, $first: Int!, $search: String, $state: String) {
  loanRequestQueue(employeeId: $employeeId, after: $after, first: $first, search: $search, state: $state) { nodes { ...LoanRequestFields } pageInfo { endCursor hasNextPage } }
}
query LoanAccount($id: String!) { loanAccount(id: $id) { ...LoanAccountFields } }
query LoanPolicy($id: String!) { loanPolicy(id: $id) { id key version currency minorUnits effectiveFrom effectiveTo rules } }
query PreviewLoanApproval($requestId: String!, $terms: JSON!, $effectiveFrom: NaiveDate!, $firstDueDate: NaiveDate!) {
  previewLoanApproval(requestId: $requestId, terms: $terms, effectiveFrom: $effectiveFrom, firstDueDate: $firstDueDate)
}
query LoanSchedulePreview($loanId: String!, $firstDueDate: NaiveDate) {
  loanSchedulePreview(loanId: $loanId, firstDueDate: $firstDueDate)
}
query LoanStatement($loanId: String!, $expectedVersion: Int!, $after: String, $first: Int!) {
  loanStatement(loanId: $loanId, expectedVersion: $expectedVersion, after: $after, first: $first) {
    nodes { id kind sourceKind sourceId valueDate amount principalDelta interestDelta reversalOf }
    pageInfo { endCursor hasNextPage }
  }
}
query LoanPolicies($after: String, $first: Int!) {
  loanPolicies(after: $after, first: $first) { nodes { id key version currency minorUnits effectiveFrom effectiveTo rules } pageInfo { endCursor hasNextPage } }
}
query LoanLedger($loanId: String!, $after: String, $first: Int!) {
  loanLedger(loanId: $loanId, after: $after, first: $first) { nodes { id kind sourceKind sourceId valueDate amount principalDelta interestDelta reversalOf } pageInfo { endCursor hasNextPage } }
}
query LoanPayments($loanId: String!, $after: String, $first: Int!) {
  loanPayments(loanId: $loanId, after: $after, first: $first) { nodes { id kind amount valueDate method externalReference unappliedCredit resignationExceptionReason } pageInfo { endCursor hasNextPage } }
}
query LoanSchedules($loanId: String!, $after: String, $first: Int!) {
  loanSchedules(loanId: $loanId, after: $after, first: $first) { nodes { id version effectiveFrom monthlyAmount recoveryMode isProjection } pageInfo { endCursor hasNextPage } }
}
mutation PublishLoanPolicy($input: PublishLoanPolicyInput!) { publishLoanPolicy(input: $input) { ...LoanCommandFields } }
mutation SubmitLoanRequest($input: SubmitLoanRequestInput!) { submitLoanRequest(input: $input) { ...LoanCommandFields } }
mutation DecideLoanRequest($input: DecideLoanRequestInput!) { decideLoanRequest(input: $input) { ...LoanCommandFields } }
mutation WithdrawLoanRequest($input: WithdrawLoanRequestInput!) { withdrawLoanRequest(input: $input) { ...LoanCommandFields } }
mutation RecordLoanDisbursement($input: RecordLoanPaymentInput!) { recordLoanDisbursement(input: $input) { ...LoanCommandFields } }
mutation RecordLoanReceipt($input: RecordLoanPaymentInput!) { recordLoanReceipt(input: $input) { ...LoanCommandFields } }
mutation SetLoanDeduction($input: SetLoanDeductionInput!) { setLoanDeduction(input: $input) { ...LoanCommandFields } }
mutation SetLoanPeriodOverride($input: SetLoanPeriodOverrideInput!) { setLoanPeriodOverride(input: $input) { ...LoanCommandFields } }
mutation ReverseLoanPosting($input: ReverseLoanPostingInput!) { reverseLoanPosting(input: $input) { ...LoanCommandFields } }
query PreviewLoanReversal($loanId: String!, $postingId: String!) {
  previewLoanReversal(loanId: $loanId, postingId: $postingId) {
    loanId postingId accountVersion occurrenceDate postingDate currency
    currentPrincipal currentInterest correctedPrincipal correctedInterest
    preservedPayrollPostings reviewFingerprint
  }
}
query LoanPolicyVersions($after: String, $first: Int) {
  loanPolicyVersions(after: $after, first: $first) { nodes { id key version status currency minorUnits effectiveFrom effectiveTo rules } pageInfo { endCursor hasNextPage } }
}
query LoanApprovalWorkflows($after: String, $first: Int!) {
  loanApprovalWorkflows(after: $after, first: $first) { nodes { id name } pageInfo { endCursor hasNextPage } }
}
mutation SaveLoanRequest($input: SubmitLoanRequestInput!) {
  saveLoanRequest(input: $input) { recordId loanId employeeId version state postingIds unappliedCredit }
}
mutation RetireLoanPolicy($input: RetireLoanPolicyInput!) {
  retireLoanPolicy(input: $input) { recordId loanId employeeId version state postingIds unappliedCredit }
}

# Payroll owns the draft recovery value date in the shared service.
mutation SetPayrollCyclePaymentDate($cycleId: ID!, $paymentDate: NaiveDate!, $expectedRevision: Int) {
  setPayrollCyclePaymentDate(cycleId: $cycleId, paymentDate: $paymentDate, expectedRevision: $expectedRevision)
}

query PreviewLoanExitReview($separationId: UUID!, $settlementDate: NaiveDate!) {
  previewLoanExitReview(separationId: $separationId, settlementDate: $settlementDate) {
    separationId employeeId lastWorkingDate separationFingerprint exposure payrollContext
  }
}
mutation SaveLoanExitReview($input: LoanExitReviewInput!) {
  saveLoanExitReview(input: $input) { id separationId exposure decision }
}
query FnfFinancialReview($separationId: UUID!) {
  fnfFinancialReview(separationId: $separationId) {
    revision fingerprint input legacyFiguresFingerprint
    settlement { id separationId status leaveEncashment gratuityAmount bonusPayable recoveryAmount netPayable financials }
  }
}
query PreviewFnfLoanExposure($separationId: UUID!, $settlementDate: NaiveDate!) {
  previewFnfLoanExposure(separationId: $separationId, settlementDate: $settlementDate)
}
query LoanFnfSettlement($separationId: ID!) {
  fnfSettlement(separationId: $separationId) {
    id separationId status leaveEncashment gratuityAmount bonusPayable recoveryAmount netPayable processedAt financials
  }
}
query FinanceFollowUpOwners($after: UUID, $first: Int!) {
  financeFollowUpOwners(after: $after, first: $first) { nodes { id name } pageInfo { endCursor hasNextPage } }
}
mutation SaveFnfFinancialReview($input: SaveFnfFinancialReviewInput!) {
  saveFnfFinancialReview(input: $input) {
    revision fingerprint input legacyFiguresFingerprint
    settlement { id separationId status leaveEncashment gratuityAmount bonusPayable recoveryAmount netPayable financials }
  }
}
mutation FinalizeReviewedFnf($separationId: ID!, $expectedRevision: Int!, $expectedFingerprint: String!) {
  finalizeFnfSettlement(separationId: $separationId, expectedRevision: $expectedRevision, expectedFingerprint: $expectedFingerprint) {
    id separationId status netPayable financials
  }
}
mutation ApproveSeparationWithFinance($separationId: ID!, $financeReviewId: ID) {
  approveSeparation(separationId: $separationId, financeReviewId: $financeReviewId) { id status }
}
mutation CancelExitFinanceApproval($operationId: ID!) {
  cancelExitApproval(operationId: $operationId)
}
query ExitApprovalOperation($separationId: ID!) {
  exitApprovalOperation(separationId: $separationId) { id reviewId state canResume }
}

mutation CancelLoanFunding($input: CancelLoanFundingInput!) {
  cancelLoanFunding(input: $input) { recordId loanId employeeId version state postingIds unappliedCredit }
}
query LoanFinancialReconciliation($loanId: String!) {
  loanFinancialReconciliation(loanId: $loanId)
}
mutation ReconcileLoanFinancials($loanId: String!) {
  reconcileLoanFinancials(loanId: $loanId)
}
query PreviewHistoricalLoanPayment($input: RecordLoanPaymentInput!, $kind: LoanHistoricalPaymentKind!) {
  previewHistoricalLoanPayment(input: $input, kind: $kind)
}
mutation RecordHistoricalLoanPayment($input: RecordHistoricalLoanPaymentInput!) {
  recordHistoricalLoanPayment(input: $input) { recordId loanId employeeId version state postingIds unappliedCredit }
}

query PreviewLoanDeduction($input: SetLoanDeductionInput!) {
  previewLoanDeduction(input: $input)
}
query PreviewLoanPeriodOverride($input: SetLoanPeriodOverrideInput!) {
  previewLoanPeriodOverride(input: $input)
}
