fragment OrganizationPageFields on OrganizationDocumentPage {
  schemaVersion
  items
  endCursor
  hasNextPage
  graphVersion
}

fragment OrganizationOutcomeFields on CommandOutcome {
  commandId
  resourceId
  status
  resourceVersion
  result
}

mutation CancelPendingOrganizationCommand($commandId: UUID!) {
  cancelPendingOrganizationCommand(commandId: $commandId) {
    ...OrganizationOutcomeFields
  }
}

fragment OrganizationChangeFields on ChangeResult {
  id
  status
  version
  organizationVersion
}

query OrganizationWorkspaces {
  organizationWorkspaces {
    id
    name
    version
    canManage
    canDelegate
    canApprove
    canReview
    canReport
    canHistory
    canPayroll
  }
}

query OrganizationIdentity {
  myOrganizationIdentity {
    principalId
    loginLinkId
    loginLinkVersion
  }
}

query OrganizationAuditHistory(
  $organizationId: UUID!
  $from: DateTime!
  $to: DateTime!
  $after: UUID
  $first: Int
) {
  organizationAuditHistory(
    organizationId: $organizationId
    from: $from
    to: $to
    after: $after
    first: $first
  )
}

query OrganizationCompanies($organizationId: UUID!) {
  organizationCompanies(organizationId: $organizationId) {
    membershipId
    tenantId
    name
    status
    version
    capabilities
    runtimeStatus
    installedVersion
    directorySyncStatus
  }
}

query OrganizationInvitations {
  organizationInvitations {
    ...OrganizationPageFields
  }
}

query OrganizationConfiguration(
  $organizationId: UUID!
  $kind: OrganizationConfigurationKind!
  $after: UUID
  $first: Int
) {
  organizationConfiguration(
    organizationId: $organizationId
    kind: $kind
    after: $after
    first: $first
  ) {
    schemaVersion
    items
    nextCursor
    organizationVersion
  }
}

query OrganizationCapabilityCatalog {
