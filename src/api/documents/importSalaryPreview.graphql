query ImportedSalaryPreview($employeeId: ID, $asOf: NaiveDate) {
  employeeSalaryBreakupPreview(employeeId: $employeeId, asOf: $asOf) {
    employeeId
    employeeSalaryStructureId
    annualCtc
    financials
    monthlyGross
    monthlyDeductions
    monthlyNetBeforeStatutory
    lines {
      salaryComponentId
      componentName
      componentCode
      componentType
      calculationBasis
      calculationValue
      annualAmount
      monthlyAmount
      isOverride
    }
  }
}
