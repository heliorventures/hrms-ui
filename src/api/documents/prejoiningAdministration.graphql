query PrejoiningAdminBootstrap {
  prejoiningConfig
  prejoiningFieldCatalog
  prejoiningDocumentTypes
}

query PrejoiningCandidatesAdmin($offset: Int!, $limit: Int!, $status: String) {
  prejoiningCandidates(offset: $offset, limit: $limit, status: $status) {
    total
    nodes {
      id
      email
      status
      revision
      config
      answers
      feedback
      documents
      expiresAt
      employeeId
      createdAt
      updatedAt
    }
  }
}

query PrejoiningCandidateAdmin($id: ID!) {
  prejoiningCandidate(id: $id) {
    id
    email
    status
    revision
    config
    answers
    feedback
    documents
    expiresAt
    employeeId
    createdAt
    updatedAt
  }
}

query PrejoiningConversionDirectory($managerSearch: String, $managerOffset: Int) {
  prejoiningConversionOptions(managerSearch: $managerSearch, managerOffset: $managerOffset)
}

mutation SavePrejoiningConfigAdmin($config: JSON!) {
  savePrejoiningConfig(config: $config)
}

mutation PrejoiningInviteAdmin($email: String!, $sendEmail: Boolean!) {
  invitePrejoining(email: $email, sendEmail: $sendEmail) {
    candidate {
      id
      email
      status
      revision
      config
      answers
      feedback
      documents
      expiresAt
      employeeId
      createdAt
      updatedAt
    }
    privateUrl
    emailStatus
    emailError
  }
}

mutation PrejoiningReissueAdmin($id: ID!, $revision: Int!, $sendEmail: Boolean!) {
