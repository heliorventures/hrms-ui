query MyAttendanceBoard(
  $fromDate: NaiveDate!
  $toDate: NaiveDate!
  $first: Int = 50
  $after: String
) {
  shifts(limit: 100) {
    id
    name
    startTime
    endTime
    workHours
    isNightShift
  }
  myAttendanceSummary(fromDate: $fromDate, toDate: $toDate) {
    completedMinutes
    workedDays
    averageMinutes
    incompleteSegments
  }
  myAttendance(fromDate: $fromDate, toDate: $toDate, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        employeeId
        workDate
        checkInAt
        checkOutAt
        checkInTime
        checkOutTime
        checkInLat
        checkInLng
        checkOutLat
        checkOutLng
        status
        source
        lateMinutes
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query AttendanceCurrentDayWindow {
  attendanceDayWindow {
    workDate
    startsAt
    endsAt
    timezone
    boundaryMinutes
  }
}

query AttendanceCorrectionWindows($workDate: NaiveDate!) {
  currentWindow: attendanceDayWindow {
    workDate
    startsAt
    endsAt
    timezone
    boundaryMinutes
  }
  selectedWindow: attendanceDayWindow(workDate: $workDate) {
    workDate
    startsAt
    endsAt
    timezone
    boundaryMinutes
  }
}

query AttendancePolicySettings($slim: Int! = 50) {
  attendanceDayPolicy {
    revision
    initialized
    legacyActivationPending
    legacyActivationDate
    currentPolicy {
      effectiveWorkDate
      boundaryMinutes
      timezone
    }
    pendingPolicy {
      effectiveWorkDate
      boundaryMinutes
      timezone
    }
    currentWindow {
      workDate
      startsAt
      endsAt
      timezone
      boundaryMinutes
    }
  }
  attendancePunchPolicy {
    id
    tenantId
    isEnforced
    siteLatitude
    siteLongitude
    maxDistanceMeters
    ipAllowlist
    updatedAt
  }
  shifts(limit: $slim) {
    id
    name
    startTime
    endTime
    workHours
    isNightShift
  }
}

query PreviewAttendanceDayPolicy($input: ScheduleAttendanceDayPolicyInput!) {
  previewAttendanceDayPolicy(input: $input) {
    revision
    transition {
      workDate
      startsAt
      endsAt
      timezone
      boundaryMinutes
    }
    following {
      workDate
      startsAt
      endsAt
      timezone
      boundaryMinutes
    }
  }
}

mutation ScheduleAttendanceDayPolicy($input: ScheduleAttendanceDayPolicyInput!) {
  scheduleAttendanceDayPolicy(input: $input) {
    revision
    initialized
    legacyActivationPending
    legacyActivationDate
    currentPolicy {
      effectiveWorkDate
      boundaryMinutes
      timezone
    }
    pendingPolicy {
      effectiveWorkDate
      boundaryMinutes
      timezone
    }
    currentWindow {
      workDate
      startsAt
      endsAt
      timezone
      boundaryMinutes
    }
  }
}

query AttendancePunchDaySummary {
  punchDaySummary {
    workDate
    startsAt
    endsAt
    timezone
    boundaryMinutes
    totalWorkedMinutes
    openSegment {
      id
      checkInAt
      checkOutAt
      checkInTime
      checkOutTime
      checkInLat
      checkInLng
      checkOutLat
      checkOutLng
      source
      status
    }
    segments {
      id
      checkInAt
      checkOutAt
      checkInTime
      checkOutTime
      checkInLat
      checkInLng
      checkOutLat
      checkOutLng
      source
      status
    }
  }
}

